services:
  db:
    image: postgres:16
    container_name: ebook2latex-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ebook2latex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ebook2latex_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: ebook2latex-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: Ebook2LateX API
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/ebook2latex_db
      UPLOADS_DIR: uploads
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: ["/bin/sh", "-lc", "sed -i 's/\\r$//' /app/start.sh && exec /bin/sh /app/start.sh"]

  frontend:
    build:
      context: ./frontend
    container_name: ebook2latex-frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
